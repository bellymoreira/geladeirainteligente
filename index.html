<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DESPENSA ZERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  padding:20px;
}

.app{
  width:360px;
  background:white;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  position:relative;
}

.header{
  background:#4CAF50;
  color:white;
  padding:25px;
}

.header h1{
  font-size:24px;
}

.header p{
  margin-top:5px;
  opacity:0.9;
}

.tabs{
  display:flex;
  border-bottom:1px solid #ddd;
}

.tab{
  flex:1;
  text-align:center;
  padding:15px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.tab.active{
  color:#4CAF50;
  border-bottom:3px solid #4CAF50;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.status-card{
  background:#66bb6a;
  margin:20px;
  padding:20px;
  border-radius:20px;
  color:white;
}

.progress{
  width:100%;
  height:10px;
  background:rgba(255,255,255,0.3);
  border-radius:10px;
  margin:15px 0;
  overflow:hidden;
}

.progress-bar{
  width:70%;
  height:100%;
  background:white;
}

.section-title{
  padding:0 20px;
  margin-bottom:15px;
  font-size:20px;
  font-weight:bold;
  color:#333;
}

.product-list,
.recipe-list{
  padding:0 20px 100px;
  max-height:450px;
  overflow-y:auto;
}

.product-card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.product-info{
  display:flex;
  align-items:center;
  gap:15px;
}

.icon{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:22px;
}

.green{background:#4CAF50;}
.yellow{background:#FFC107;}
.red{background:#F44336;}

.product-text h3{
  font-size:16px;
  color:#333;
}

.product-text p{
  font-size:13px;
  color:#777;
}

.status{
  font-weight:bold;
  font-size:14px;
}

.fab{
  position:absolute;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border:none;
  border-radius:50%;
  background:#4CAF50;
  color:white;
  font-size:30px;
  cursor:pointer;
}

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  width:320px;
  padding:25px;
  border-radius:20px;
}

.modal-content h2{
  margin-bottom:20px;
}

.input-group{
  margin-bottom:15px;
}

.input-group input,
.input-group select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

.save-btn,
.recipe-btn{
  width:100%;
  padding:14px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

.checkbox-group{
  padding:0 20px;
  margin-bottom:20px;
}

.checkbox-group label{
  display:block;
  margin-bottom:10px;
  font-size:15px;
}

.recipe-card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.recipe-card h3{
  margin-bottom:8px;
  color:#333;
}

.recipe-card p{
  font-size:14px;
  color:#666;
  margin-bottom:5px;
}
.close-modal{
  display:flex;
  justify-content:flex-end;
  cursor:pointer;
  font-size:20px;
  margin-bottom:10px;
  color:#666;
}

.close-modal:hover{
  color:#F44336;
}
.actions{
  display:flex;
  flex-direction:column;
  align-items:end;
  gap:10px;
}

.delete-btn{
  border:none;
  background:#ffe5e5;
  color:#d32f2f;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  transition:0.3s;
}

.delete-btn:hover{
  background:#f44336;
  color:white;
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>DESPENSA ZERO</h1>
    <p>Controle sua validade e evite desperdícios</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="openTab('products')">
      Produtos
    </div>

    <div class="tab" onclick="openTab('recipes')">
      O que Cozinhar?
    </div>
  </div>

  <!-- TELA PRODUTOS -->
  <div class="screen active" id="products">

    <div class="status-card">
      <h2>Status da Despensa</h2>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>

      <p>70% dos produtos estão OK</p>
    </div>

    <div class="section-title">
      Produtos
    </div>

    <div class="product-list" id="productList"></div>

    <button class="fab" onclick="openModal()">
      +
    </button>

  </div>

  <!-- TELA RECEITAS -->
  <div class="screen" id="recipes">

    <div class="section-title" style="margin-top:20px;">
      Ingredientes urgentes selecionados para você:
    </div>

    <div class="checkbox-group" id="ingredientCheckboxes"></div>

    <div style="padding:0 20px 20px;">
      <button class="recipe-btn" onclick="searchRecipes()">
        Buscar Receitas com esses Ingredientes
      </button>
    </div>

    <div class="recipe-list" id="recipeList"></div>

  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <!-- BOTÃO FECHAR -->
    <div class="close-modal" onclick="closeModal()">
      ✖
    </div>

    <h2>Adicionar Produto</h2>

    <div class="input-group">
      <input type="text" id="productName" placeholder="Nome do produto">
    </div>

    <div class="input-group">
      <input type="date" id="productDate">
    </div>

    <button class="save-btn" onclick="addProduct()">
      Salvar
    </button>

  </div>
</div>

<script>

const productList = document.getElementById("productList");
const recipeList = document.getElementById("recipeList");
const modal = document.getElementById("modal");

let products = [
  {name:"Leite", date:"2026-06-05", status:"yellow", emoji:"🥛"},
  {name:"Queijo", date:"2026-06-06", status:"yellow", emoji:"🧀"},
  {name:"Frango", date:"2026-06-07", status:"yellow", emoji:"🍗"},
  {name:"Tomate", date:"2026-06-08", status:"yellow", emoji:"🍅"},
  {name:"Brócolis", date:"2026-06-09", status:"green", emoji:"🥦"}
];

function renderProducts() {

productList.innerHTML = "";

products.forEach((prod, index) => {

  const card = document.createElement("div");

  card.className = "product-card";

  card.innerHTML = `
    <div class="product-info">

      <div class="icon ${prod.status}">
        ${prod.emoji}
      </div>

      <div class="product-text">
        <h3>${prod.name}</h3>
        <p>Validade: ${prod.date}</p>
      </div>

    </div>

    <div class="actions">

      <div class="status"
        style="color:
        ${prod.status === 'green' ? '#4CAF50' :
        prod.status === 'yellow' ? '#FFC107' :
        '#F44336'}">

        ${prod.status === 'green' ? 'OK' :
        prod.status === 'yellow' ? 'Quase vencendo' :
        'Vencido'}

      </div>

      <button
        class="delete-btn"
        onclick="deleteProduct(${index})"
      >
        ✕ Remover
      </button>

    </div>
  `;

  productList.appendChild(card);

});

}


// FUNÇÃO EXCLUIR
function deleteProduct(index) {

const confirmDelete = confirm(
  "Deseja remover este produto da despensa?"
);

if (confirmDelete) {

  products.splice(index, 1);

  renderProducts();
  renderUrgentIngredients();

}
}

function getEmoji(food){

  const name = food.toLowerCase();

  if(name.includes("leite")) return "🥛";
  if(name.includes("queijo")) return "🧀";
  if(name.includes("frango")) return "🍗";
  if(name.includes("tomate")) return "🍅";
  if(name.includes("brocolis") || name.includes("brócolis")) return "🥦";
  if(name.includes("ovo")) return "🥚";
  if(name.includes("banana")) return "🍌";
  if(name.includes("maçã") || name.includes("maca")) return "🍎";
  if(name.includes("pão")) return "🍞";
  if(name.includes("pizza")) return "🍕";
  if(name.includes("arroz")) return "🍚";
  if(name.includes("macarrão") || name.includes("macarrao")) return "🍝";

  return "🍴";
}

function openModal(){
  modal.style.display = "flex";
}

function closeModal(){
  modal.style.display = "none";

  document.getElementById("productName").value = "";
  document.getElementById("productDate").value = "";
  document.getElementById("productStatus").value = "green";
}

function addProduct(){

  const name = document.getElementById("productName").value;
  const date = document.getElementById("productDate").value;
  const status = document.getElementById("productStatus").value;

  if(name && date){

    products.push({
      name:name,
      date:date,
      status:status,
      emoji:getEmoji(name)
    });

    renderProducts();
    renderUrgentIngredients();

    closeModal();

  } else {

    alert("Preencha todos os campos!");

  }
}

function openTab(tabId){

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.classList.remove("active");
  });

  document.getElementById(tabId).classList.add("active");

  event.target.classList.add("active");
}

function renderUrgentIngredients(){

  const container = document.getElementById("ingredientCheckboxes");

  container.innerHTML = "";

  const urgentProducts = products.filter(
    p => p.status === "yellow"
  );

  urgentProducts.forEach(prod => {

    container.innerHTML += `
      <label>
        <input type="checkbox" checked value="${prod.name}">
        ${prod.emoji} ${prod.name}
      </label>
    `;

  });

}

function searchRecipes(){

  recipeList.innerHTML = "";

  const checked = document.querySelectorAll(
    "#ingredientCheckboxes input:checked"
  );

  let ingredients = [];

  checked.forEach(item=>{
    ingredients.push(item.value.toLowerCase());
  });

  if(ingredients.includes("frango")){

    recipeList.innerHTML += `
      <div class="recipe-card">
        <h3>🍲 Strogonoff de Frango Express</h3>
        <p>Você evita o vencimento de 3 ingredientes.</p>
        <p>⏱️ Tempo: 25 minutos</p>
        <p>⭐ Dificuldade: Fácil</p>
      </div>
    `;
  }

  if(ingredients.includes("tomate")){

    recipeList.innerHTML += `
      <div class="recipe-card">
        <h3>🍅 Salada Especial de Tomate</h3>
        <p>Você utiliza ingredientes próximos do vencimento.</p>
        <p>⏱️ Tempo: 10 minutos</p>
        <p>⭐ Dificuldade: Muito Fácil</p>
      </div>
    `;
  }

  if(ingredients.includes("queijo")){

    recipeList.innerHTML += `
      <div class="recipe-card">
        <h3>🧀 Macarrão Cremoso com Queijo</h3>
        <p>Você aproveita queijo antes do vencimento.</p>
        <p>⏱️ Tempo: 20 minutos</p>
        <p>⭐ Dificuldade: Fácil</p>
      </div>
    `;
  }

  if(recipeList.innerHTML === ""){

    recipeList.innerHTML = `
      <div class="recipe-card">
        <h3>Nenhuma receita encontrada 😢</h3>
        <p>Tente selecionar outros ingredientes.</p>
      </div>
    `;

  }
}

renderProducts();
renderUrgentIngredients();

</script>

</body>

<script src="script.js"></script>

</html>
